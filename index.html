<title>Radio Classic</title>
<meta name="theme-color" content="#0b0c1c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Radio Classic">

<style>
:root{--bg:#dfe3e8;--fg:#222;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14161a;--fg:#ddd}}
:root[data-theme="dark"]{--bg:#14161a;--fg:#ddd}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:-apple-system,"Helvetica Neue",Arial,sans-serif;user-select:none;-webkit-user-select:none;touch-action:none}
.ipod{width:300px;height:480px;border-radius:30px;background:linear-gradient(145deg,#fafafa,#cfd2d6);box-shadow:0 20px 50px rgba(0,0,0,.35),inset 0 0 0 2px #fff;padding:20px;box-sizing:border-box;display:flex;flex-direction:column;align-items:center}
.screen{width:100%;height:210px;background:#f3f7fb;border:3px solid #8a8f96;border-radius:8px;overflow:hidden;color:#111;display:flex;flex-direction:column;box-shadow:inset 0 0 8px rgba(0,0,0,.3)}
.bar{height:24px;background:linear-gradient(#e9f0f8,#b9c8da);border-bottom:1px solid #8c9bb0;display:flex;align-items:center;justify-content:space-between;padding:0 8px;font-size:13px;font-weight:600}
.row{padding:0 10px;height:30px;display:flex;align-items:center;justify-content:space-between;font-size:15px}
.row small{opacity:.6;font-size:11px}
.row.sel{background:linear-gradient(#4f8ff0,#2468d8);color:#fff}
#now{display:none;flex:1;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:6px 10px;text-align:center}
#now b{font-size:16px}#now span{font-size:12px;opacity:.7}
canvas{width:100%;height:70px}
.vol{width:80%;height:6px;border:1px solid #666;border-radius:3px;overflow:hidden}.vol i{display:block;height:100%;background:#2468d8}
.wheel{margin-top:22px;width:210px;height:210px;border-radius:50%;background:linear-gradient(145deg,#f1f1f3,#c9cacf);box-shadow:inset 0 0 0 1px #fff,0 2px 6px rgba(0,0,0,.25);position:relative;touch-action:none;cursor:grab}
.wheel span{position:absolute;font-size:12px;font-weight:700;color:#7b7e86;pointer-events:none}
.t{top:14px;left:50%;transform:translateX(-50%)}.b{bottom:14px;left:50%;transform:translateX(-50%)}.l{left:16px;top:50%;transform:translateY(-50%)}.r{right:16px;top:50%;transform:translateY(-50%)}
.center{position:absolute;left:50%;top:50%;width:78px;height:78px;margin:-39px 0 0 -39px;border-radius:50%;border:0;background:linear-gradient(145deg,#fdfdfd,#d3d4d8);box-shadow:0 1px 4px rgba(0,0,0,.3);cursor:pointer}
.center:active{background:#cfd0d5}
.hint{margin-top:14px;font-size:12px;opacity:.6;text-align:center}

.ipod{position:relative;z-index:1;width:320px;height:520px;border-radius:44px;background:linear-gradient(160deg,rgba(255,255,255,.16),rgba(255,255,255,.04));backdrop-filter:blur(24px) saturate(1.5);-webkit-backdrop-filter:blur(24px) saturate(1.5);border:1px solid rgba(255,255,255,.22);box-shadow:0 30px 80px rgba(0,0,0,.6),0 0 70px color-mix(in srgb,var(--acc) 30%,transparent),inset 0 1px 0 rgba(255,255,255,.35)}
.screen{background:#06070d;border:1px solid rgba(255,255,255,.14);border-radius:20px;height:224px;color:#eef0ff;box-shadow:inset 0 0 30px color-mix(in srgb,var(--acc) 18%,transparent),0 0 0 4px rgba(0,0,0,.35)}
.bar{background:none;border-bottom:1px solid rgba(255,255,255,.08);color:#9aa0c0;font-size:11px;letter-spacing:.12em;text-transform:uppercase;height:28px}
.bar #ind{color:var(--acc)}
.row{height:30px;margin:1px 6px;border-radius:10px;padding:0 10px;font-size:15px}
.row.sel{background:linear-gradient(90deg,var(--acc),color-mix(in srgb,var(--acc) 45%,#000));color:#fff;box-shadow:0 0 18px color-mix(in srgb,var(--acc) 55%,transparent)}
.row small{background:rgba(255,255,255,.12);padding:2px 8px;border-radius:99px;opacity:1;font-size:10px}
#now b{font-size:18px;background:linear-gradient(90deg,#fff,var(--acc));-webkit-background-clip:text;background-clip:text;color:transparent}
#now span{color:#9aa0c0;opacity:1}
.orb{width:50px;height:50px;border-radius:50%;background:conic-gradient(var(--acc),#0a0b14,var(--acc),#0a0b14,var(--acc));box-shadow:0 0 24px var(--acc),inset 0 0 0 14px #06070d,inset 0 0 0 16px rgba(255,255,255,.2);animation:spin 3s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
canvas{height:64px}
.vol{border:0;background:rgba(255,255,255,.12);height:4px}.vol i{background:var(--acc);box-shadow:0 0 8px var(--acc)}
.wheel{background:radial-gradient(circle at 30% 22%,#444858,#12131a 70%);box-shadow:inset 0 0 0 1px rgba(255,255,255,.14),0 8px 24px rgba(0,0,0,.5),0 0 30px color-mix(in srgb,var(--acc) 22%,transparent)}
.wheel span{color:#8d93ad}
.center{background:radial-gradient(circle at 35% 30%,#2b2e3b,#0c0d13);border:1px solid color-mix(in srgb,var(--acc) 70%,transparent);box-shadow:0 0 16px color-mix(in srgb,var(--acc) 45%,transparent)}
.center:active{background:#0c0d13;box-shadow:0 0 26px var(--acc)}
.swap{animation:swap .28s ease-out}@keyframes swap{from{opacity:0;transform:translateX(var(--dx,18px))}}
.tools{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:12px;display:flex;gap:8px;z-index:5}
.tools button{width:38px;height:38px;border-radius:50%;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.12);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);color:#fff;font-size:17px;cursor:pointer;box-shadow:0 0 14px color-mix(in srgb,var(--acc) 35%,transparent)}
.tools button:hover{background:rgba(255,255,255,.25)}
#list{flex:1;min-height:0;overflow:hidden}#now{position:relative}
:root{--lv:0}
.glow{scale:calc(1 + var(--lv)*.3)}
#bg i{scale:calc(1 + var(--lv)*.035)}
#slp{font-size:10px;margin-right:6px}
canvas{height:44px}
#now .trk{font-size:11px;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--acc)}
:root[data-theme="light"] #now .trk{color:color-mix(in srgb,var(--acc) 70%,#000)}
.screen.tune{animation:tune .45s steps(7)}
@keyframes tune{0%{filter:brightness(2) contrast(2) blur(1.5px);transform:skewX(6deg)}40%{filter:brightness(.5) contrast(1.4);transform:skewX(-4deg)}100%{filter:none;transform:none}}
.tools button.on{border-color:var(--acc);box-shadow:0 0 16px var(--acc)}
.fav{position:absolute;top:0;right:4px;background:none;border:0;color:var(--acc);font-size:22px;line-height:1;cursor:pointer;text-shadow:0 0 10px var(--acc)}
:root[data-theme="light"] #bg::after{background:linear-gradient(rgba(240,242,255,.6),rgba(240,242,255,.38)),repeating-linear-gradient(0deg,rgba(0,0,0,.05) 0 2px,transparent 2px 4px)}
:root[data-theme="light"] .brand{color:#14162a;text-shadow:none}
:root[data-theme="light"] .hint{color:#2a2d44;text-shadow:none}
:root[data-theme="light"] .glow{mix-blend-mode:normal;opacity:.3}
:root[data-theme="light"] .tools button{color:#14162a;border-color:rgba(0,0,0,.2);background:rgba(255,255,255,.55)}
:root[data-theme="light"] .ipod{background:linear-gradient(160deg,rgba(255,255,255,.8),rgba(255,255,255,.4));border-color:rgba(255,255,255,.9);box-shadow:0 30px 70px rgba(30,30,80,.35),0 0 60px color-mix(in srgb,var(--acc) 28%,transparent),inset 0 1px 0 #fff}
:root[data-theme="light"] .screen{background:#f5f7ff;color:#14162a;border-color:rgba(0,0,0,.15);box-shadow:inset 0 0 26px color-mix(in srgb,var(--acc) 16%,transparent),0 0 0 4px rgba(0,0,0,.08)}
:root[data-theme="light"] .bar{color:#5a6080;border-color:rgba(0,0,0,.08)}
:root[data-theme="light"] .row small{background:rgba(0,0,0,.08)}
:root[data-theme="light"] .row.sel small{background:rgba(255,255,255,.25)}
:root[data-theme="light"] #now span{color:#5a6080}
:root[data-theme="light"] #now b{background:linear-gradient(90deg,#14162a,var(--acc));-webkit-background-clip:text;background-clip:text}
:root[data-theme="light"] .orb{box-shadow:0 0 24px var(--acc),inset 0 0 0 14px #f5f7ff,inset 0 0 0 16px rgba(0,0,0,.15)}
:root[data-theme="light"] .vol{background:rgba(0,0,0,.12)}
:root[data-theme="light"] .wheel{background:radial-gradient(circle at 30% 22%,#fff,#cfd3e0 75%);box-shadow:inset 0 0 0 1px #fff,0 8px 24px rgba(30,30,80,.3),0 0 30px color-mix(in srgb,var(--acc) 20%,transparent)}
:root[data-theme="light"] .wheel span{color:#6a708c}
:root[data-theme="light"] .center{background:radial-gradient(circle at 35% 30%,#fff,#d9dce8)}
:root[data-theme="light"] .center:active{background:#d9dce8}
</style></head>
<body>
<div id="bg"><i></i></div><canvas id="fx"></canvas>
<div class="glow"></div>
<div class="tools"><button id="slb" title="Таймер сна" aria-label="Таймер сна">☾</button><button id="rnd" title="Случайная станция" aria-label="Случайная станция">⚄</button><button id="thm" title="Тема" aria-label="Сменить тему">◐</button><button id="siz" title="Размер" aria-label="Сменить размер">⤢</button></div>
<div class="brand">RADIO<b>CLASSIC</b></div>
<div class="ipod">
  <div class="screen">
    <div class="bar"><span id="ttl">Radio</span><span><span id="slp"></span><span id="ind"></span></span></div>
    <div id="list"></div>
    <div id="now"><button id="fav" class="fav" aria-label="В избранное">♡</button><div class="orb" id="orb"></div><b id="nn"></b><span id="nt"></span><span id="trk" class="trk"></span><canvas id="cv" width="232" height="70"></canvas><div class="vol"><i id="vl"></i></div></div>
  </div>
  <div class="wheel" id="wheel">
    <span class="t">MENU</span><span class="r">▶▶</span><span class="b">▶❚❚</span><span class="l">◀◀</span>
    <button class="center" id="ok" aria-label="Выбрать"></button>
  </div>
</div>
<div class="hint">Крути колесо мышью или пальцем · центр — выбор · клавиши: ↑↓ Enter Esc Space ←→ · F ♥ · R ⚄</div>
<script>
const $=s=>document.querySelector(s);
const hz=m=>440*Math.pow(2,(m-69)/12);
let ctx,bus,master,an,aud=new Audio(),timer,step=0,nextT=0,cur=-1,playing=false,vol=.7,noiseB,TR=0,BM=1,stn=0;
function init(){
  if(ctx)return;
  ctx=new (window.AudioContext||window.webkitAudioContext)();
  master=ctx.createGain();master.gain.value=vol;
  an=ctx.createAnalyser();an.fftSize=64;
  bus=ctx.createBiquadFilter();bus.type="lowpass";
  bus.connect(master);master.connect(an);an.connect(ctx.destination);
  noiseB=ctx.createBuffer(1,ctx.sampleRate,ctx.sampleRate);
  const d=noiseB.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
}
function tone(m,t,d,type,v,att=.01){
  const o=ctx.createOscillator(),g=ctx.createGain();
  o.type=type;o.frequency.value=hz(m+TR);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+att);
  g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g);g.connect(bus);o.start(t);o.stop(t+d+.05);
}
function noise(t,d,v,hp){
  const s=ctx.createBufferSource(),f=ctx.createBiquadFilter(),g=ctx.createGain();
  s.buffer=noiseB;f.type="highpass";f.frequency.value=hp;
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  s.connect(f);f.connect(g);g.connect(bus);s.start(t);s.stop(t+d+.02);
}
function kick(t,v=.9){
  const o=ctx.createOscillator(),g=ctx.createGain();
  o.frequency.setValueAtTime(140,t);o.frequency.exponentialRampToValueAtTime(40,t+.12);
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+.25);
  o.connect(g);g.connect(bus);o.start(t);o.stop(t+.3);
}
const snare=(t,v=.35)=>noise(t,.14,v,1800), hat=(t,v=.1)=>noise(t,.04,v,7000);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const chord=(ms,t,d,type,v,att)=>ms.forEach(m=>tone(m,t,d,type,v,att));

const G=[
 {name:"Lo-fi Chill",tag:"Lo-fi",bpm:76,lp:1800,
  step(i,t){const b=Math.floor(i/16)%4,s=i%16;
   const C=[[57,60,64,67],[50,57,60,65],[55,59,62,65],[48,55,59,64]][b];
   if(s==0){chord(C,t,3,"triangle",.07,.08);tone(C[0]-12,t,1.4,"sine",.3)}
   if(s==8)tone(C[0]-12,t,1,"sine",.25);
   if(s==0||s==10)kick(t,.7);if(s==4||s==12)snare(t,.2);if(s%2==0)hat(t,.05);
   if(s%2==0&&Math.random()<.3)tone(pick([69,72,74,76,79]),t,.6,"sine",.1)}},
 {name:"Late Night Jazz",tag:"Jazz",bpm:112,lp:3500,
  step(i,t){const b=Math.floor(i/16)%4,s=i%16;
   const R=[50,55,48,48][b],C=[[62,65,69,72],[59,62,65,69],[60,64,67,71],[60,64,67,71]][b];
   if(s==0||s==6||s==10)chord(C,t,.9,"triangle",.07,.02);
   if(s%4==0)tone(R-12+pick([0,4,7,9]),t,.4,"sine",.35);
   if([0,4,6,8,12,14].includes(s))hat(t,.07);if(s==8)snare(t,.07);
   if(s%2==0&&Math.random()<.4)tone(pick([62,65,67,69,72,74,77]),t,.5,"sine",.12)}},
 {name:"Neon Electronic",tag:"Electronic",bpm:124,lp:5000,
  step(i,t){const b=Math.floor(i/16)%4,s=i%16;
   const R=[45,41,48,43][b];
   if(s%4==0)kick(t);if(s==4||s==12)snare(t,.25);if(s%4==2){hat(t,.12);tone(R-12,t,.2,"sawtooth",.18)}
   tone(R+12+[0,7,12,7][s%4],t,.12,"square",.05)}},
 {name:"Garage Rock",tag:"Rock",bpm:118,lp:2800,
  step(i,t){const b=Math.floor(i/16)%4,s=i%16;
   const R=[45,41,48,43][b];
   if(s==0||s==8||s==10)kick(t);if(s==4||s==12)snare(t,.4);if(s%2==0)hat(t,.09);
   if(s%2==0){tone(R,t,.18,"sawtooth",.16);tone(R+7,t,.18,"sawtooth",.1)}
   if(s==0)tone(R+12,t,.9,"sawtooth",.05)}},
 {name:"Deep Ambient",tag:"Ambient",bpm:60,lp:2200,
  step(i,t){const b=Math.floor(i/32)%4,s=i%32;
   const C=[[57,64,67,71],[53,60,64,69],[48,55,64,67],[55,62,67,71]][b];
   if(s==0)chord(C,t,9,"sine",.09,2.5);
   if(s%4==0&&Math.random()<.3)tone(pick([81,83,84,88]),t,2,"sine",.05,.05)}},
 {name:"Old School Hip-Hop",tag:"Hip-Hop",bpm:90,lp:3200,
  step(i,t){const b=Math.floor(i/16)%4,s=i%16;
   const R=[36,41,39,43][b],C=[[60,63,67,70],[65,68,72,75],[63,67,70,74],[67,70,74,77]][b];
   if(s==0||s==10||(s==7&&b%2))kick(t,.95);
   if(s==4||s==12){snare(t,.45);noise(t,.08,.15,900)}
   if(s%2==0)hat(t,s%4==0?.12:.07);else if(Math.random()<.2)hat(t,.04);
   if(s==0)tone(R,t,.9,"sine",.5);if(s==10)tone(R,t,.4,"sine",.4);if(s==14&&Math.random()<.5)tone(R+7,t,.25,"sine",.3);
   if(s==0||s==6||(s==11&&Math.random()<.5))chord(C,t,.45,"triangle",.06,.01);
   if(Math.random()<.3)noise(t,.03,.03,5000)}}
];

function start(i,s){
  init();stop();cur=i;if(s!==undefined){stn=s;tune();newTrack()}TR=ST[i][stn][1];BM=ST[i][stn][2];playing=true;mediaOn();
  const u=ST[i][stn][3]||G[i].url;if(u){aud.src=u;aud.volume=vol;aud.play().catch(()=>{});}
  else{
    bus.frequency.value=G[i].lp;ctx.resume();step=0;nextT=ctx.currentTime+.08;
    timer=setInterval(()=>{while(nextT<ctx.currentTime+.25){G[i].step(step,nextT);nextT+=60/(G[i].bpm*BM)/4;step++}},50);
  }
  draw();
}
function stop(){clearInterval(timer);aud.pause();keep.pause();if(navigator.mediaSession)navigator.mediaSession.playbackState="paused"}
function toggle(){
  if(cur<0){start(0);scr="now";render();return}
  if(playing){stop();playing=false;if(ctx)ctx.suspend()}else{start(cur)}
  render();
}
function jump(d){const n=G.length*3;let f=(cur<0?0:cur*3+stn)+d;f=(f+n)%n;start(f/3|0,f%3);render()}

let scr="main",sel=0,ACC="#7c5cff",lastScr="main";
const COL=["#ffb86b","#b48cff","#22e4ff","#ff4d5e","#5eead4","#ffd23f"];
const main=[["Жанры","›"],["Избранное","♥"],["Случайная","⚄"],["Сейчас играет","›"]];
const ST=[
 [["Rainy Window",0,1],["Sunday Tape",3,1.08],["Midnight Study",-2,.92]],
 [["Blue Room",0,1],["Smoke & Piano",-3,.9],["Uptown Swing",2,1.12]],
 [["Neon Drive",0,1],["Night Pulse",2,1.06],["Deep Grid",-3,.97]],
 [["Garage Days",0,1],["Highway",2,1.08],["Basement Show",-2,.94]],
 [["Drift",0,1],["Aurora",3,1],["Deep Sea",-4,.9]],
 [["Boom Bap 90s",0,1],["181.FM Old School",-2,.93,"https://listen.181fm.com/181-oldschool_128k.mp3"],["Y2K Beats",3,1.06]]
];
let gsel=0,favs=[];
try{favs=JSON.parse(localStorage.getItem("rc-fav")||"[]")}catch(e){}
const isFav=(g,s)=>favs.includes(g*3+s);
function tune(){
  const t=ctx.currentTime,s=ctx.createBufferSource(),f=ctx.createBiquadFilter(),g=ctx.createGain();
  s.buffer=noiseB;s.loop=true;f.type="bandpass";f.Q.value=2;
  f.frequency.setValueAtTime(300,t);f.frequency.exponentialRampToValueAtTime(3500,t+.2);f.frequency.exponentialRampToValueAtTime(900,t+.4);
  g.gain.setValueAtTime(.35,t);g.gain.exponentialRampToValueAtTime(.0001,t+.45);
  s.connect(f);f.connect(g);g.connect(master);s.start(t);s.stop(t+.5);
  const sc=document.querySelector(".screen");sc.classList.remove("tune");void sc.offsetWidth;sc.classList.add("tune");
}
const ART=[["Moon Cassette","Kiro & the Rain","Soft Static","Nori Bloom","Tape Garden"],["The Velvet Quartet","Miles Ardent","Blue Hour Trio","Cleo Marsh","Late Set"],["Pulse Theory","NEON//ARC","Grid Runner","Vanta","Ion Bloom"],["The Loose Wires","Rust & Thunder","Black Pine","Static Kings","Garage Saints"],["Aeon Field","Low Orbit","Mira Voss","Tidal Mind","Hollow Sky"],["MC Dusty","Crate Kings","Lil Vinyl","The Block Poets","DJ Marlow"]];
let trk="",trkEnd=0;
function newTrack(){
  const A=["Midnight","Velvet","Paper","Slow","Blue","Faded","Golden","Quiet","Neon","Lost","Last","Summer"],N=["Rain","Coffee","Window","Train","Skyline","Letters","Echo","Harbor","Dream","Smoke","Drive","Fire"];
  trk=ST[cur][stn][3]?"Прямой эфир · 181.FM":pick(A)+" "+pick(N)+" · "+pick(ART[cur]);trkEnd=Date.now()+(60+Math.random()*60)*1000;mediaMeta();
}
function rand(){const f=Math.floor(Math.random()*G.length*3);start(f/3|0,f%3);scr="now";render()}
function toggleFav(){if(cur<0)return;const f=cur*3+stn,k=favs.indexOf(f);k<0?favs.push(f):favs.splice(k,1);try{localStorage.setItem("rc-fav",JSON.stringify(favs))}catch(x){}if(scr==="favs")sel=Math.max(0,Math.min(sel,favs.length-1));render()}
function items(){
  if(scr==="main")return main;
  if(scr==="stations")return ST[gsel].map((s,k)=>[s[0],isFav(gsel,k)?"♥":""]);
  if(scr==="favs")return favs.length?favs.map(f=>[ST[f/3|0][f%3][0],G[f/3|0].tag]):[["Пока пусто","♡"]];
  return G.map(g=>[g.name,g.tag])}
function render(){
  if(scr!==lastScr){const o=["main","genres","favs","stations","now"],dx=o.indexOf(scr)>o.indexOf(lastScr)?"18px":"-18px";["#list","#now"].forEach(q=>{const e=$(q);e.style.setProperty("--dx",dx);e.classList.remove("swap");void e.offsetWidth;e.classList.add("swap")});lastScr=scr}
  ACC=cur>=0?COL[cur]:"#7c5cff";document.documentElement.style.setProperty("--acc",ACC);$("#orb").style.animationPlayState=playing?"running":"paused";
  $("#ind").textContent=playing?"▶":(cur>=0?"❚❚":"");
  $("#ttl").textContent=({main:"Radio Classic",genres:"Жанры",stations:G[gsel].tag,favs:"Избранное",now:"Сейчас играет"})[scr];
  const L=$("#list"),N=$("#now");
  if(scr==="now"){
    L.style.display="none";N.style.display="flex";
    $("#nn").textContent=cur>=0?ST[cur][stn][0]:"Ничего не играет";
    $("#nt").textContent=cur>=0?G[cur].name+" · "+(stn+1)+"/3":"Выберите жанр в меню";
    $("#trk").textContent=cur>=0?"♪ "+trk:"";$("#vl").style.width=vol*100+"%";$("#fav").textContent=cur>=0&&isFav(cur,stn)?"♥":"♡";
  }else{
    N.style.display="none";L.style.display="block";
    L.innerHTML=items().map((r,i)=>`<div class="row${i===sel?" sel":""}"><span>${r[0]}</span><small style="color:inherit">${r[1]||"›"}</small></div>`).join("");const e=L.querySelector(".sel");if(e)e.scrollIntoView({block:"nearest"});
  }
}
function move(d){
  if(scr==="now"){vol=Math.min(1,Math.max(0,vol+d*.05));if(master)master.gain.value=vol;aud.volume=vol;}
  else sel=Math.min(items().length-1,Math.max(0,sel+d));
  render();
}
function select(){
  if(scr==="main"){if(sel===0){scr="genres";sel=Math.max(cur,0)}else if(sel===1){scr="favs";sel=0}else if(sel===2){rand();return}else scr="now"}
  else if(scr==="genres"){gsel=sel;scr="stations";sel=cur===gsel?stn:0}
  else if(scr==="stations"){start(gsel,sel);scr="now"}
  else if(scr==="favs"){if(favs.length){const f=favs[sel];start(f/3|0,f%3);scr="now"}}
  else toggle();
  render();
}
function back(){if(scr==="now"){scr="stations";gsel=Math.max(cur,0);sel=stn}else if(scr==="stations"){scr="genres";sel=gsel}else if(scr==="genres"||scr==="favs"){scr="main";sel=0}render()}

const wheel=$("#wheel");let lastA=null,acc=0,moved=false,downA=0;
const ang=e=>{const r=wheel.getBoundingClientRect();return Math.atan2(e.clientY-(r.top+r.height/2),e.clientX-(r.left+r.width/2))*180/Math.PI};
wheel.addEventListener("pointerdown",e=>{if(e.target.id==="ok")return;wheel.setPointerCapture(e.pointerId);lastA=ang(e);downA=lastA;acc=0;moved=false});
wheel.addEventListener("pointermove",e=>{
  if(lastA===null)return;
  const a=ang(e);let d=a-lastA;if(d>180)d-=360;if(d<-180)d+=360;lastA=a;acc+=d;
  if(Math.abs(acc)>=22){moved=true;const n=Math.trunc(acc/22);move(n);acc-=n*22}
});
wheel.addEventListener("pointerup",e=>{
  if(lastA===null)return;lastA=null;
  if(moved)return;
  const r=wheel.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2);
  const a=Math.atan2(dx,-dy)*180/Math.PI;

<script>
(()=>{
const c=document.getElementById("fx"),x=c.getContext("2d"),S=4;
let W,H,P=[],lv=0,D;
function level(){let t=0;if(typeof an!=="undefined"&&an&&playing){D=D||new Uint8Array(an.frequencyBinCount);an.getByteFrequencyData(D);t=(D[0]+D[1]+D[2])/765}lv+=(t-lv)*.35;document.documentElement.style.setProperty("--lv",lv.toFixed(3));return lv}
function size(){W=c.width=Math.ceil(innerWidth/S);H=c.height=Math.ceil(innerHeight/S)}
addEventListener("resize",size);size();
const cols=["255,70,90","90,140,255","220,230,255"];
function mk(first){
  const a=Math.random()*Math.PI*2,d=first?Math.random()*.6:0;
  return{a,d,v:.004+Math.random()*.01,c:cols[Math.floor(Math.random()*3)],l:2+Math.floor(Math.random()*5)};
}
for(let i=0;i<70;i++)P.push(mk(true));

(function f(){
  requestAnimationFrame(f);

  const cx=W*.38,cy=H*.55,R=Math.max(W,H);

    p.d+=p.v*(1+p.d*3)*(1+lv*2.5);
    if(p.d>1){P[i]=mk(false);return}
    const r=p.d*R*.8,px=Math.round(cx+Math.cos(p.a)*r),py=Math.round(cy+Math.sin(p.a)*r*.6);
    x.fillStyle="rgba("+p.c+","+(.15+p.d*.5+lv*.3).toFixed(2)+")";
    for(let k=0;k<p.l;k++)x.fillRect(Math.round(px-Math.cos(p.a)*k*(1+p.d*2)),Math.round(py-Math.sin(p.a)*k*.6*(1+p.d*2)),1,1);
  });
})();
})();
</script>
